[package]
name = "af-core"
description = "AlphaForge processing core: image I/O, classic ops, local AI inference, pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
# ONNX Runtime is loaded dynamically from the app directory (no download at build time).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std", "half", "cuda", "api-22"] }
half = "2.7"
qcms = "0.3"
rgb = "0.8"
imgref = "1.12"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "rayon"] }
webp = { version = "0.3", default-features = false }
ravif = "0.13"
avif-decode = { version = "3", default-features = false }
jpeg-encoder = { version = "0.7", features = ["simd"] }
png = "0.18"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
fast_image_resize = { version = "6", features = ["rayon"] }
rayon = "1.11"

safetensors = "0.8"
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
lru = "0.16"
color_quant = "1.1"
libloading = "0.9"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
nvml-wrapper = "0.13"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3"
