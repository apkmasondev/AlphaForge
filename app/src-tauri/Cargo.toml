[package]
name = "alphaforge"
description = "AlphaForge — local image toolkit: background removal, upscaling, resizing, conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "alphaforge"

[lib]
name = "alphaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
af-core = { path = "../../crates/af-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
lru = "0.16"
rayon = "1.11"
crossbeam-channel = "0.5"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
clipboard-win = "5.4"
image = { version = "0.25", default-features = false }
